{{ $suite := or .suite "trixie" }}
{{ $variant := or .variant "minbase" }}
{{ $gitinfo := or .gitinfo "unknown" }}
{{ $testsdir := or .testsdir "prebuilt/tests" }}
{{ $btrfstoolsdir := or .btrfstoolsdir "prebuilt/btrfs-tools" }}
{{ $flipctldir := or .flipctldir "prebuilt/flipctl" }}

architecture: arm64

actions:
  - action: mmdebstrap
    description: Bootstrap a base Debian {{ $suite }} system
    suite: {{ $suite }}
    variant: {{ $variant }}
    keyring: /usr/share/keyrings/debian-archive-keyring.gpg
    components:
      - main
      - contrib
      - non-free
      - non-free-firmware
    include:
      - acl
      - adduser
      - alsa-ucm-conf
      - alsa-utils
      - apt-transport-https
      - avahi-daemon
      - bash-completion
      - bc
      - bluez
      - bluez-firmware
      - bluez-meshd
      - bsdextrautils
      - bsdmainutils
      - btrfs-compsize
      - btrfs-progs
      - build-essential
      - ca-certificates
      - cec-utils
      - chromium
      - curl
      - device-tree-compiler
      - dmidecode
      - dnsmasq-base
      - drm-info
      - duperemove
      - e2fsprogs
      - edid-decode
      - evtest
      - file
      - fio
      - firmware-misc-nonfree
      - gcc
      - git
      - glmark2-wayland
      - gpiod
      - gstreamer1.0-plugins-bad
      - gstreamer1.0-tools
      - htop
      - i2c-tools
      - inetutils-telnet
      - initramfs-tools
      - iperf3
      - iproute2
      - iptables
      - iputils-ping
      - iw
      - iwd
      - jq
      - kexec-tools
      - kmscube
      - less
      - libcanberra-pulse
      - libdrm-tests
      - libfreeaptx0
      - liblc3-1
      - libldacbt-abr2
      - libldacbt-enc2
      - libopus0
      - libsbc1
      - libspa-0.2-bluetooth
      - libtypec-utils
      - libubootenv-tool
      - libusb-1.0-0-dev
      - links
      - linux-cpupower
      - linux-sysctl-defaults
      - lm-sensors
      - locales
      - lshw
      - lsof
      - make
      - mc
      - mesa-utils
      - modemmanager
      - nano
      - network-manager-config-connectivity-debian
      - nftables
      - nodejs
      - openssh-server
      - p7zip
      - pciutils
      - pipewire-alsa
      - powercap-utils
      - pv
      - python3-evdev
      - python3-pandas
      - python3-plotly
      - rfkill
      - rsync
      - sox
      - strace
      - stress-ng
      - sudo
      - sway
      - sysstat
      - systemd
      - systemd-repart
      - systemd-resolved
      - systemd-sysv
      - systemd-timesyncd
      - tcpdump
      - tinycbor-utils
      - traceroute
      - udev
      - umtp-responder
      - unzip
      - upower
      - usb-modeswitch
      - usbutils
      - util-linux-extra
      - v4l-utils
      - vim-tiny
      - wget
      - wireless-regdb
      - wireplumber
      - wpasupplicant
      - zstd

  - action: run
    description: Generate en_US.UTF-8 locale
    chroot: true
    command: sed -i 's/^# en_US.UTF-8/en_US.UTF-8/' /etc/locale.gen && locale-gen

  - action: run
    description: Set default locale
    chroot: true
    command: echo "LANG=en_US.UTF-8" > /etc/default/locale

  - action: run
    description: Add default user "user" with password "user"
    chroot: true
    command: useradd -s /bin/bash -F -m user &&
             echo "user:user" | chpasswd &&
             gpasswd -a user audio &&
             gpasswd -a user bluetooth &&
             gpasswd -a user sudo &&
             gpasswd -a user input &&
             gpasswd -a user video &&
             gpasswd -a user render

  - action: run
    description: Add dedicated "flipctl" user
    chroot: true
    command: useradd -s /usr/sbin/nologin -d /var/lib/flipctl -G input,video,render -m -r flipctl

  - action: run
    description: Create user's .bash_aliases
    chroot: true
    command: |
      echo "alias pastebin='curl --data-binary @- https://staging.getpost.workers.dev/'" >> /home/user/.bash_aliases
      chown user:user /home/user/.bash_aliases

  - action: run
    description: Add sbin directories to user's PATH
    chroot: true
    command: printf '\nexport PATH=$PATH:/usr/local/sbin:/usr/sbin:/sbin\n' >> /home/user/.bashrc

  - action: download
    description: Download the most recent version of sbc-bench
    url: https://raw.githubusercontent.com/ThomasKaiser/sbc-bench/master/sbc-bench.sh
    name: sbc-bench

  - action: overlay
    description: Copy sbc-bench into root
    origin: sbc-bench
    destination: /usr/bin/sbc-bench.sh

  - action: run
    chroot: true
    command: chmod +x /usr/bin/sbc-bench.sh

  # mergiraf: syntax-aware 3-way merge used by migrate-profile (not in Debian; prebuilt aarch64
  # binary). Pinned; bump the version deliberately. Tarball unpacked host-side (unpack), then the
  # binary is copied in like sbc-bench.
  - action: download
    description: Download mergiraf 0.18.0 (aarch64)
    url: https://codeberg.org/mergiraf/mergiraf/releases/download/v0.18.0/mergiraf_aarch64-unknown-linux-gnu.tar.gz
    name: mergiraf
    unpack: true
    compression: gz

  - action: overlay
    description: Copy mergiraf into /usr/local/bin
    origin: mergiraf
    source: mergiraf
    destination: /usr/local/bin/mergiraf

  - action: run
    chroot: true
    command: chmod +x /usr/local/bin/mergiraf

  - action: overlay
    description: Overlay our config defaults
    source: overlays/configs
    destination: /etc

  # The Rust toolchain, so a flipctl framework app can be built on the device. Must follow the
  # overlay above, which puts trixie-backports in the sources. Each name says its suite because
  # backports is priority 100: cargo alone fails, since apt then refuses to take rustc from
  # there. libstd-rust-1.94 and libllvm21 follow on their own, which keeps a version out of
  # this file. 445MB installed.
  - action: apt
    description: Install the Rust toolchain from trixie-backports
    recommends: false
    packages:
      - cargo/trixie-backports
      - rustc/trixie-backports
      - libstd-rust-dev/trixie-backports

  - action: overlay
    description: Overlay Broadcom WiFi/BT firmware files
    source: overlays/firmware
    destination: /usr/lib/firmware

  - action: overlay
    description: Overlay our usr/local scripts
    source: overlays/usr/local
    destination: /usr/local

  - action: overlay
    description: Overlay the btrfs profile and snapshot tools
    source: {{ $btrfstoolsdir }}/scripts
    destination: /usr/local/sbin

  - action: overlay
    description: Overlay the btrfs shared helpers
    source: {{ $btrfstoolsdir }}/libs
    destination: /usr/lib

  - action: overlay
    description: Overlay the btrfs kernel-install plugins
    source: {{ $btrfstoolsdir }}/hooks
    destination: /etc/kernel/install.d

  # flipper-bless-boot.service, which removes a boot entry's counter once the boot it came
  # from reached boot-complete.target. Without it every boot is counted and none is ever
  # blessed, so three boots take every entry to 'bad'. It is wired to start, and Debian's
  # own systemd-boot-check-no-failures.service is wired to gate the target, by the symlinks
  # in overlays/configs/systemd.
  - action: overlay
    description: Overlay the btrfs boot-assessment unit
    source: {{ $btrfstoolsdir }}/systemd
    destination: /usr/lib/systemd/system

  - action: overlay
    description: Overlay flipctl, its apps, its remote-view assets and the app framework
    source: {{ $flipctldir }}
    destination: /usr

  # An app is built in its own directory, so it has to belong to whoever flipctl runs as
  # or cargo cannot create its target/ and stops with "Permission denied (os error 13)".
  # Read out of the unit rather than named here, because this image has two candidates: a
  # dedicated flipctl system user, and the `user` the unit actually asks for. Only the
  # apps change hands; the framework under share/flipctl/crates stays root-owned, since a
  # build reads it and never writes to it.
  - action: run
    description: Let the user flipctl runs as rebuild an app in place
    chroot: true
    command: |
      unit=/usr/lib/systemd/system/flipctl.service
      u=$(sed -n 's/^User=//p' "$unit" | head -n1)
      g=$(sed -n 's/^Group=//p' "$unit" | head -n1)
      chown -R "${u:-user}:${g:-${u:-user}}" /usr/share/flipctl/apps

  # flipctl offers to rebuild an app whose binary is older than a source beside it, and the
  # order build-flipctl.sh installs them in does not survive the copy into the image: every
  # file lands with the time it was written here, and radio's ui/app.slint came out 4ms after
  # its binary, which was enough to ask. Stamping the binaries last says what was meant.
  - action: run
    description: Make each shipped app binary newer than its sources
    chroot: true
    command: |
      find /usr/share/flipctl/apps -mindepth 4 -maxdepth 4 -path '*/target/release/*' \
        -type f -exec touch {} +

  - action: overlay
    description: Overlay our usr/share files
    source: overlays/usr/share
    destination: /usr/share

  # NetworkManager ignores connection profiles that are world-readable.
  # Git can not track 600 permission, so we must set it here.
  - action: run
    description: Fix permissions on NetworkManager connection profiles
    chroot: true
    command: chmod 600 /etc/NetworkManager/system-connections/*.nmconnection

  - action: run
    description: Save GIT info
    chroot: true
    command: |
      echo 'BUILD_GIT="{{ $gitinfo }}"' >> /etc/os-release

  # Ship no per-device identity: the missing machine-id makes systemd treat the first boot of
  # every root as a first boot, which is what sshd-keygen.service waits for to run ssh-keygen -A.
  - action: run
    description: Remove /etc/machine-id, default /etc/motd and the ssh host keys
    chroot: true
    command: rm -f /etc/machine-id /etc/motd /etc/ssh/ssh_host_*

  - action: run
    description: Switch to upstream signed regulatory.db
    chroot: true
    command: update-alternatives --set regulatory.db /lib/firmware/regulatory.db-upstream

  - action: overlay
    description: Copy test suite into the target
    source: {{ $testsdir }}
    destination: /flipperone-testing

  - action: run
    description: Make test suite writable for all users
    chroot: true
    command: chmod -R o+w /flipperone-testing

  - action: apt
    packages:
      - cog
      - ffmpeg
      - firmware-mediatek
      - libavcodec-extra
      - libavfilter-extra
      - libavformat-extra
      - lpac
      - mesa-teflon-delegate

  - action: overlay
    description: Overlay Kodi Chromium kiosk launcher
    source: overlays/home/user/
    destination: /home/user/

  - action: run
    description: Fix ownership of overlaid home files
    chroot: true
    command: chown -R user:user /home/user

  - action: pack
    description: Save the ospack archive
    file: debian-ospack.tar.zst
    compression: zstd
