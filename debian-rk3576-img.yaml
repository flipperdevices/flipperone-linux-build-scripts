{{ $sectorsize := or .sectorsize 512 }}
{{ $imagesize  := or .imagesize  "4GiB" }}
{{ $kerneldir  := or .kerneldir  "prebuilt/linux" }}
# cmdline: shared facts + policy only. The BLS generator adds the per-entry rootflags=subvol=
# and the serial consoles (console=ttyS0/ttyS4/fbcon or ttyFIQ0, per kernel config).
{{ $cmdline    := or .cmdline    "audit=0 console=tty1" }}
{{ $fslabel    := or .fslabel    "flipperos" }}
# btrfsopts: fs-wide mount options. ssd is FORCED (loopback device)
{{ $btrfsopts  := or .btrfsopts  "compress=zstd,noatime,ssd,discard=async" }}
{{ $rootdev    := "findmnt -fn --nofsroot -o SOURCE --target $IMAGEMNTDIR" }}

architecture: arm64
sectorsize: {{ $sectorsize }}
actions:
  - action: unpack
    description: Load the ospack archive
    file: debian-ospack.tar.zst

  # Native btrfs subvolumes (debos go-debos#736), all top-level (subvolid=5 siblings), not
  # nested. boot (not "@boot") is shared and outside the profile roots, so snapshots never
  # capture it and U-Boot resolves /boot from the default subvol; compression=none keeps the
  # kernel/dtb/initrd readable without a zstd-capable U-Boot btrfs driver. @Minimal is the
  # base and deploy target; @home/@var-* are shared; @snapshots is created but never mounted.
  # Per-profile @*_stock/@<profile> roots are snapshotted post-deploy below. fsck:false = passno 0.
  - action: image-partition
    imagename: debian-nobootloader.img
    imagesize: {{ $imagesize }}
    partitiontype: gpt
    partitions:
      - name: loader
        fs: none
        start: 32KiB
        end: 64MiB
      - name: root
        fs: btrfs
        fslabel: {{ $fslabel }}
        fsck: false
        start: 64MiB
        end: -1MiB
        subvolumes:
          - name: boot
            properties: { compression: none }
          - name: "@Minimal"
          - name: "@home"
          - name: "@snapshots"
          - name: "@var-log"
          - name: "@var-cache"
    mountpoints:
      - mountpoint: /
        partition: root
        subvolume: "@Minimal"
        options: [ {{ $btrfsopts }} ]
      - mountpoint: /boot
        partition: root
        subvolume: boot
        options: [ {{ $btrfsopts }} ]
      - mountpoint: /home
        partition: root
        subvolume: "@home"
        options: [ {{ $btrfsopts }} ]
      - mountpoint: /var/log
        partition: root
        subvolume: "@var-log"
        options: [ {{ $btrfsopts }} ]
      - mountpoint: /var/cache
        partition: root
        subvolume: "@var-cache"
        options: [ {{ $btrfsopts }} ]

  # Single-device UFS profiles: dup metadata + dup system (survive a bad block; system is the
  # tiny but fatal chunk tree), single data. Matches the current mkfs default, but debos passes
  # only mkfs -O/-E (not -m/-d) and that default has flipped across btrfs-progs versions, so
  # assert it with a soft balance (no-op when already correct; runs on the empty fs, instant).
  - action: run
    description: Assert btrfs profiles dup metadata+system / single data (single-device UFS)
    chroot: false
    command: |
      set -eu
      btrfs balance start -mconvert=dup,soft -sconvert=dup,soft -dconvert=single,soft --force "$IMAGEMNTDIR"

  # Deploys into @Minimal and writes the fstab + root=UUID. The root subvol is not in the
  # cmdline (only shared policy: root=UUID, audit, console); the BLS generator adds
  # rootflags=subvol= per entry. debos puts subvol=@Minimal on the / line; the next step drops it.
  - action: filesystem-deploy
    append-kernel-cmdline: {{ $cmdline }}

  # All profiles share this fstab and boot their own root via rootflags=subvol=, so keep the /
  # line subvol-agnostic. subvol=@Minimal is unique to the / line (others are boot/@home/@var-*).
  - action: run
    description: Drop subvol=@Minimal from the / fstab line (keep it subvol-agnostic)
    chroot: false
    command: |
      set -eu
      sed -i 's/,subvol=@Minimal//' "$IMAGEMNTDIR/etc/fstab"

  # journald's append-heavy writes fragment badly under btrfs copy-on-write. Pre-create
  # the journal dir with NODATACOW (chattr +C) while it's still empty, so the journal
  # files written on first boot inherit it. (+C also implies no compression.)
  - action: run
    description: Disable CoW on the systemd journal directory
    chroot: false
    command: |
      set -eu
      mkdir -p "$IMAGEMNTDIR/var/log/journal"
      chattr +C "$IMAGEMNTDIR/var/log/journal"

  - action: overlay
    description: Copy Linux kernel packages into the target
    source: {{ $kerneldir }}
    origin: artifacts
    destination: /var/cache/linux-kernel

  # Bake @Minimal's entry-token before the kernel install, so the kernel-install plugin stages the
  # kernel into /boot/<token>/ instead of the 'debian' fallback. @Minimal is the build root, so its
  # token is the one the plugin reads. NN is derived from @Minimal's position in flipper-profiles.
  - action: run
    description: Pin @Minimal's kernel entry-token before the kernel install
    chroot: true
    command: |
      set -eu
      . /usr/lib/flipper-bls.sh
      mkdir -p /etc/kernel
      make_token "$(profile_base_nn @Minimal)" @Minimal > /etc/kernel/entry-token

  - action: run
    description: Install Linux kernel packages inside the target
    chroot: true
    command: find /var/cache/linux-kernel -name linux-image-\*.deb -a ! -name \*-dbg_\* -print0 | xargs -0 apt install -y

  - action: run
    description: Prune orphaned packages and apt cache
    chroot: true
    command: |
      set -eu
      apt-get autoremove --purge -y
      apt-get clean
      rm -rf /var/lib/apt/lists/*

  # The kernel-install plugin only wrote @Minimal's entry (the build root). Fan the installed
  # kernel(s) out to every profile: one entry + a reflinked /boot/<token>/ per profile per version
  # (token = <NN>-flipperos-<subvol>, NN from the flipper-profiles order). The shared logic lives in
  # /usr/lib/flipper-bls.sh; this build step is the only fan-out (the plugin handles one root).
  - action: run
    description: Generate the per-profile BLS entries for the installed kernel(s)
    chroot: true
    command: |
      set -eu
      . /usr/lib/flipper-bls.sh
      CONF_ROOT=/etc/kernel; PROFILES=/etc/kernel/flipper-profiles; ENTRIES=/boot/loader/entries
      MACHINE_ID=""; DEVICETREE=""; DEVICETREE_ENTRY=""; BOOT_MNT="/"
      mkdir -p "$ENTRIES"; SORT_KEY="$(os_sort_key)"
      for _k in /boot/vmlinuz-*; do
        [ -e "$_k" ] || continue
        KERNEL_VERSION="${_k#/boot/vmlinuz-}"; KCONFIG="/boot/config-$KERNEL_VERSION"
        set_dtb_dirs; discover_devicetreedir; compute_base_opts
        _i=0
        while IFS='|' read -r tok suf extra gate dtbos legend; do
          tok="$(echo "$tok" | tr -d '[:space:]')"; case "$tok" in ''|\#*) continue ;; esac
          extra="$(trim "$extra")"; _sv="$(subvol_of "$extra")"
          ENTRY_TOKEN="$(make_token "$(printf '%03d' "$((900 - _i * 100))")" "$_sv")"
          remove_entries "$_sv" "$KERNEL_VERSION"; stage_kernel_reflink
          emit_entry "$(trim "$suf")" "$extra" "$(trim "$gate")" "$(trim "$dtbos")"
          _i=$((_i + 1))
        done <"$PROFILES"
      done

  # Default session for every profile: the no-DE multi-user target, where the cog-seat1
  # kiosk runs (and @TV's kodi, enabled under multi-user). Only @Desktop overrides this to
  # graphical.target (for sddm); @Minimal/@Router/@TV all stay on multi-user.
  - action: run
    description: Set the default boot target to multi-user (only @Desktop overrides)
    chroot: true
    command: systemctl set-default multi-user.target

  # ===========================================================================
  # Stock (RO) bases + per-profile bootable roots.
  #
  # @Minimal_stock is the RO golden image of the common base. Each profile is a
  # WRITABLE snapshot of it (COW: shares the base, only profile packages add new extents),
  # mounted at $IMAGEMNTDIR so standard debos `apt`/`overlay` actions install into it;
  # it is then locked RO and the writable @<profile> bootable root is snapshotted from it.
  # BLS selects a profile via rootflags=subvol=@<profile>. The kernel lives in
  # @Minimal_stock (installed above), so every profile inherits it via COW. /boot,
  # @home and @var-* are separate top-level subvols shared by all profiles.
  #
  # KDE and TV-Media-Box install their packages (apt) + config (overlay); only @Desktop changes
  # its default target (to graphical, for sddm); TV/Router/Minimal stay on multi-user.
  # Router applies only its config overlay (NM AP/WAN + ip-forwarding); no packages needed.
  # ===========================================================================

  - action: run
    description: Lock @Minimal_stock (RO), re-create @Minimal from it, free the mountpoint
    chroot: false
    command: |
      set -eu
      # @Minimal's entry-token was baked before the kernel install, so @Minimal_stock (snapshotted
      # here) and the re-created @Minimal both inherit it; no need to rewrite it.
      sync
      ROOTPART="$({{ $rootdev }})"                 # @Minimal is still mounted at $IMAGEMNTDIR
      # Mount the btrfs top level at a fixed path and KEEP it mounted for the whole profile
      # sequence: it is our stable handle for `findmnt --target` (device lookup then works in
      # every debos mode, whether or not $IMAGEMNTDIR is mounted) and where the subvols live.
      TOP="${IMAGEMNTDIR%/}.toplevel"
      mkdir -p "$TOP"
      mount -t btrfs -o subvolid=5 "$ROOTPART" "$TOP"
      btrfs subvolume snapshot -r "$TOP/@Minimal" "$TOP/@Minimal_stock"
      # release @Minimal and its nested submounts so we can replace it and profile
      # factories can mount here
      findmnt -rno TARGET --submounts "$IMAGEMNTDIR" \
        | awk '{ print length, $0 }' | sort -rn | cut -d" " -f2- \
        | while read -r mp; do umount "$mp"; done
      # Re-create @Minimal as a writable child of the golden base (parent = @Minimal_stock)
      # so it matches the other profiles (each a snapshot of its _stock) instead of being
      # the build origin with no parent.
      btrfs subvolume delete "$TOP/@Minimal"
      btrfs subvolume snapshot "$TOP/@Minimal_stock" "$TOP/@Minimal"

  # --- @Desktop ------------------------------------------------------------------
  - action: run
    description: Snapshot writable @Desktop_stock and mount it
    chroot: false
    command: |
      set -eu
      TOP="${IMAGEMNTDIR%/}.toplevel"
      ROOTPART="$(findmnt -fn --nofsroot -o SOURCE --target "$TOP")"
      btrfs subvolume snapshot "$TOP/@Minimal_stock" "$TOP/@Desktop_stock"
      mount -t btrfs -o "{{ $btrfsopts }},subvol=@Desktop_stock" "$ROOTPART" "$IMAGEMNTDIR"
  - action: apt
    description: KDE desktop packages
    recommends: false        # image is minbase/no-recommends; deps are listed explicitly
    packages:
      - bluedevil
      - blueman
      - breeze-gtk-theme
      - kde-config-gtk-style
      - kde-config-screenlocker
      - kde-spectacle
      - kde-standard
      - konsole
      - kscreen
      - mpv
      - plasma-nm
      - plasma-systemmonitor
      - powerdevil
      - sddm
      - sddm-theme-breeze
      - systemsettings
  - action: run
    description: Prune orphaned packages and apt cache
    chroot: true
    command: |
      set -eu
      apt-get autoremove --purge -y
      apt-get clean
      rm -rf /var/lib/apt/lists/*
  - action: overlay
    description: KDE profile config (sddm autologin, plasma, wallpaper)
    source: overlays/profile-kde
    destination: /
  - action: run
    description: Make the KDE desktop the default session on @Desktop
    chroot: true
    command: systemctl set-default graphical.target
  - action: run
    description: Pin @Desktop's kernel entry-token (NN from flipper-profiles)
    chroot: true
    command: |
      set -eu
      . /usr/lib/flipper-bls.sh
      make_token "$(profile_base_nn @Desktop)" @Desktop > /etc/kernel/entry-token
  - action: run
    description: Lock @Desktop_stock RO and spawn writable @Desktop
    chroot: false
    command: |
      set -eu
      TOP="${IMAGEMNTDIR%/}.toplevel"
      umount "$IMAGEMNTDIR"
      btrfs property set "$TOP/@Desktop_stock" ro true
      btrfs subvolume snapshot "$TOP/@Desktop_stock" "$TOP/@Desktop"

  # --- @TV-Media-Box ---------------------------------------------------------
  - action: run
    description: Snapshot writable @TV-Media-Box_stock and mount it
    chroot: false
    command: |
      set -eu
      TOP="${IMAGEMNTDIR%/}.toplevel"
      ROOTPART="$(findmnt -fn --nofsroot -o SOURCE --target "$TOP")"
      btrfs subvolume snapshot "$TOP/@Minimal_stock" "$TOP/@TV-Media-Box_stock"
      mount -t btrfs -o "{{ $btrfsopts }},subvol=@TV-Media-Box_stock" "$ROOTPART" "$IMAGEMNTDIR"
  - action: apt
    description: TV media box packages
    recommends: false
    packages:
      - cage
      - kodi
      - kodi-eventclients-kodi-send
  - action: run
    description: Prune orphaned packages and apt cache
    chroot: true
    command: |
      set -eu
      apt-get autoremove --purge -y
      apt-get clean
      rm -rf /var/lib/apt/lists/*
  - action: overlay
    description: TV media box profile config (kodi, enabled under multi-user)
    source: overlays/profile-tv-media-box
    destination: /
  - action: run
    description: Pin @TV-Media-Box's kernel entry-token (NN from flipper-profiles)
    chroot: true
    command: |
      set -eu
      . /usr/lib/flipper-bls.sh
      make_token "$(profile_base_nn @TV-Media-Box)" @TV-Media-Box > /etc/kernel/entry-token
  - action: run
    description: Lock @TV-Media-Box_stock RO and spawn writable @TV-Media-Box
    chroot: false
    command: |
      set -eu
      TOP="${IMAGEMNTDIR%/}.toplevel"
      umount "$IMAGEMNTDIR"
      btrfs property set "$TOP/@TV-Media-Box_stock" ro true
      btrfs subvolume snapshot "$TOP/@TV-Media-Box_stock" "$TOP/@TV-Media-Box"

  # --- @Router ---------------------------------------------------------------
  - action: run
    description: Snapshot writable @Router_stock and mount it
    chroot: false
    command: |
      set -eu
      TOP="${IMAGEMNTDIR%/}.toplevel"
      ROOTPART="$(findmnt -fn --nofsroot -o SOURCE --target "$TOP")"
      btrfs subvolume snapshot "$TOP/@Minimal_stock" "$TOP/@Router_stock"
      mount -t btrfs -o "{{ $btrfsopts }},subvol=@Router_stock" "$ROOTPART" "$IMAGEMNTDIR"
  # @Router needs no packages beyond Minimal (NetworkManager + dnsmasq-base + wpa_supplicant
  # are common); it just adds the AP/WAN connections + ip-forwarding via the overlay. Its
  # default session stays multi-user (inherited); NM autoconnect brings the router up.
  - action: overlay
    description: Router profile config (NM AP/WAN connections, ip-forwarding)
    source: overlays/profile-router
    destination: /
  - action: run
    description: Fix NetworkManager connection permissions on @Router
    chroot: true
    command: chmod 600 /etc/NetworkManager/system-connections/*.nmconnection
  - action: run
    description: Pin @Router's kernel entry-token (NN from flipper-profiles)
    chroot: true
    command: |
      set -eu
      . /usr/lib/flipper-bls.sh
      make_token "$(profile_base_nn @Router)" @Router > /etc/kernel/entry-token
  - action: run
    description: Lock @Router_stock RO and spawn writable @Router
    chroot: false
    command: |
      set -eu
      TOP="${IMAGEMNTDIR%/}.toplevel"
      umount "$IMAGEMNTDIR"
      btrfs property set "$TOP/@Router_stock" ro true
      btrfs subvolume snapshot "$TOP/@Router_stock" "$TOP/@Router"

  # Restore the full @Minimal layout (all 5 debos mountpoints) so image-partition Cleanup can
  # unmount them and detach the loop; the profile builds left them unmounted. Mount shallow-first.
  - action: run
    description: Unmount the top level and restore the @Minimal layout for debos cleanup
    chroot: false
    command: |
      set -eu
      TOP="${IMAGEMNTDIR%/}.toplevel"
      ROOTPART="$(findmnt -fn --nofsroot -o SOURCE --target "$TOP")"
      umount "$TOP"; rmdir "$TOP"
      mount -t btrfs -o "{{ $btrfsopts }},subvol=@Minimal"   "$ROOTPART" "$IMAGEMNTDIR"
      mount -t btrfs -o "{{ $btrfsopts }},subvol=boot"       "$ROOTPART" "$IMAGEMNTDIR/boot"
      mount -t btrfs -o "{{ $btrfsopts }},subvol=@home"      "$ROOTPART" "$IMAGEMNTDIR/home"
      mount -t btrfs -o "{{ $btrfsopts }},subvol=@var-log"   "$ROOTPART" "$IMAGEMNTDIR/var/log"
      mount -t btrfs -o "{{ $btrfsopts }},subvol=@var-cache" "$ROOTPART" "$IMAGEMNTDIR/var/cache"