{{ $sectorsize := or .sectorsize 512 }}
{{ $imagesize  := or .imagesize  "4GiB" }}
{{ $kerneldir  := or .kerneldir  "prebuilt/linux" }}
# cmdline: shared facts + policy only. The BLS generator adds the per-entry rootflags=subvol=
# and the serial consoles (console=ttyS0/ttyS4/fbcon or ttyFIQ0, per kernel config).
{{ $cmdline    := or .cmdline    "audit=0 console=tty1" }}
{{ $fslabel    := or .fslabel    "flipperos" }}
# btrfsopts: fs-wide mount options. ssd is FORCED (loopback/eMMC isn't reliably
# detected as non-rotational).
{{ $btrfsopts  := or .btrfsopts  "compress=zstd,noatime,ssd,discard=async" }}
{{ $rootdev    := "findmnt -fn --nofsroot -o SOURCE --target $IMAGEMNTDIR" }}
# build number (buildbot: build number; local: timestamp) embedded in every _stock name
# (@<Profile>_<buildno>_stock) so stocks from different builds coexist; roots stay unversioned.
{{ $buildid := .buildid }}

architecture: arm64
sectorsize: {{ $sectorsize }}
actions:
  - action: unpack
    description: Load the ospack archive
    file: debian-ospack.tar.zst

  # debos formats btrfs (default flags, random FSUUID), mounts the top level at
  # $IMAGEMNTDIR, and records the standard root fstab line + root=UUID.
  # fsck:false -> passno 0 (no boot-time fsck for btrfs).
  - action: image-partition
    imagename: debian-nobootloader.img
    imagesize: {{ $imagesize }}
    partitiontype: gpt
    partitions:
      - name: loader
        fs: none
        start: 32KiB
        end: 60MiB
      - name: metadata
        fs: none
        start: 60MiB
        end: 64MiB
      - name: root
        fs: btrfs
        fslabel: {{ $fslabel }}
        fsck: false
        start: 64MiB
        end: -1MiB
    mountpoints:
      - mountpoint: /
        partition: root
        options: [ compress=zstd, noatime, ssd, discard=async, x-systemd.growfs ]

  # Subvolume layout (no reformat). /boot is a TOP-LEVEL subvolume named "boot"
  # (not "@boot") so it sits outside the per-profile root subvolumes -> a single shared
  # /boot that root snapshots never capture, and so U-Boot, which reads the default
  # (top-level) subvolume, resolves /boot/extlinux/... straight into it. Keep the default
  # subvolume as the top level (do NOT set a default subvolume) or U-Boot won't see /boot.
  - action: run
    description: Create subvolumes and mount the layout
    chroot: false
    command: |
      set -eu
      ROOTPART="$({{ $rootdev }})"

      # debos has the top level (subvolid=5) mounted here; create subvolumes on it.
      # @Minimal_stock is the common base / build target (the RO golden image every profile
      # snapshots from); @snapshots holds runtime snapshots.
      for sv in @Minimal_{{ $buildid }}_stock boot @home @snapshots @var-log @var-cache; do
        btrfs subvolume create "$IMAGEMNTDIR/$sv"
      done
      umount "$IMAGEMNTDIR"

      # Mount @Minimal_stock at the mount point debos owns, then nest the rest under it.
      mount -t btrfs -o "{{ $btrfsopts }},subvol=@Minimal_{{ $buildid }}_stock" "$ROOTPART" "$IMAGEMNTDIR"
      mkdir -p "$IMAGEMNTDIR/boot" \
               "$IMAGEMNTDIR/home" \
               "$IMAGEMNTDIR/var/log" \
               "$IMAGEMNTDIR/var/cache"
      mount -t btrfs -o "{{ $btrfsopts }},subvol=boot"       "$ROOTPART" "$IMAGEMNTDIR/boot"
      # Keep /boot uncompressed so U-Boot can read the kernel/dtb/initrd regardless
      # of whether its btrfs driver was built with zstd support. The property is
      # stored on the subvolume and inherited by files added later (kernel updates).
      btrfs property set "$IMAGEMNTDIR/boot" compression none
      mount -t btrfs -o "{{ $btrfsopts }},subvol=@home"      "$ROOTPART" "$IMAGEMNTDIR/home"
      mount -t btrfs -o "{{ $btrfsopts }},subvol=@var-log"   "$ROOTPART" "$IMAGEMNTDIR/var/log"
      mount -t btrfs -o "{{ $btrfsopts }},subvol=@var-cache" "$ROOTPART" "$IMAGEMNTDIR/var/cache"

  # debos writes the standard root line into /etc/fstab and root=UUID into the cmdline.
  # The root subvolume is NOT baked here: /etc/kernel/cmdline carries only shared facts +
  # policy (root=UUID, audit, console=tty1). The BLS generator supplies rootflags=subvol=
  # per entry (from flipper-profiles at build, from findmnt at runtime). Deploy into @Minimal_stock.
  - action: filesystem-deploy
    append-kernel-cmdline: {{ $cmdline }}

  # Add fstab entries for the non-root subvolumes (debos only generated the root
  # line). The FSUUID is read back at build time. These (/boot, /home, /var/log,
  # /var/cache) are shared by every profile root. @snapshots is intentionally omitted:
  # it holds runtime snapshots, managed on demand, never auto-mounted.
  - action: run
    description: Append subvolume entries to /etc/fstab
    chroot: false
    command: |
      set -eu
      ROOTPART="$({{ $rootdev }})"
      FSUUID="$(blkid -o value -s UUID -p -c none "$ROOTPART")"
      cat >> "$IMAGEMNTDIR/etc/fstab" <<EOF
      UUID=$FSUUID  /boot        btrfs  {{ $btrfsopts }},subvol=boot        0  0
      UUID=$FSUUID  /home        btrfs  {{ $btrfsopts }},subvol=@home       0  0
      UUID=$FSUUID  /var/log     btrfs  {{ $btrfsopts }},subvol=@var-log    0  0
      UUID=$FSUUID  /var/cache   btrfs  {{ $btrfsopts }},subvol=@var-cache  0  0
      EOF

  # journald's append-heavy writes fragment badly under btrfs copy-on-write. Pre-create
  # the journal dir with NODATACOW (chattr +C) while it's still empty, so the journal
  # files written on first boot inherit it. (+C also implies no compression.)
  - action: run
    description: Disable CoW on the systemd journal directory
    chroot: false
    command: |
      set -eu
      mkdir -p "$IMAGEMNTDIR/var/log/journal"
      chattr +C "$IMAGEMNTDIR/var/log/journal"

  - action: overlay
    description: Copy Linux kernel packages into the target
    source: {{ $kerneldir }}
    origin: artifacts
    destination: /var/cache/linux-kernel

  # Bake @Minimal's entry-token before the kernel install, so the kernel-install plugin stages the
  # kernel into /boot/<token>/ instead of the 'debian' fallback. The build root (@Minimal_stock) is
  # where the plugin reads it; @Minimal inherits it via the snapshot. NN is from flipper-profiles.
  - action: run
    description: Pin @Minimal's kernel entry-token before the kernel install
    chroot: true
    command: |
      set -eu
      . /usr/lib/flipper-bls.sh
      mkdir -p /etc/kernel
      make_token "$(profile_base_nn @Minimal)" @Minimal > /etc/kernel/entry-token

  - action: run
    description: Install Linux kernel packages inside the target
    chroot: true
    command: find /var/cache/linux-kernel -name linux-image-\*.deb -a ! -name \*-dbg_\* -print0 | xargs -0 apt install -y

  - action: run
    description: Prune orphaned packages and apt cache
    chroot: true
    command: |
      set -eu
      apt-get autoremove --purge -y
      apt-get clean
      rm -rf /var/lib/apt/lists/*

  # The kernel-install plugin only wrote @Minimal's entry (the pinned token). Fan the installed
  # kernel(s) out to every profile: one entry + a reflinked /boot/<token>/ per profile per version
  # (token = <NN>-flipperos-<subvol>, NN from the flipper-profiles order). The shared logic lives in
  # /usr/lib/flipper-bls.sh; this build step is the only fan-out (the plugin handles one root).
  - action: run
    description: Generate the per-profile BLS entries for the installed kernel(s)
    chroot: true
    command: |
      set -eu
      . /usr/lib/flipper-bls.sh
      CONF_ROOT=/etc/kernel; PROFILES=/etc/kernel/flipper-profiles; ENTRIES=/boot/loader/entries
      MACHINE_ID=""; DEVICETREE=""; DEVICETREE_ENTRY=""; BOOT_MNT="/"
      mkdir -p "$ENTRIES"; SORT_KEY="$(os_sort_key)"
      for _k in /boot/vmlinuz-*; do
        [ -e "$_k" ] || continue
        KERNEL_VERSION="${_k#/boot/vmlinuz-}"; KCONFIG="/boot/config-$KERNEL_VERSION"
        set_dtb_dirs; discover_devicetreedir; compute_base_opts
        _i=0
        while IFS='|' read -r tok suf extra gate dtbos legend; do
          tok="$(echo "$tok" | tr -d '[:space:]')"; case "$tok" in ''|\#*) continue ;; esac
          extra="$(trim "$extra")"; _sv="$(subvol_of "$extra")"
          ENTRY_TOKEN="$(make_token "$(printf '%03d' "$((900 - _i * 100))")" "$_sv")"
          remove_entries "$_sv" "$KERNEL_VERSION"; stage_kernel_reflink
          emit_entry "$(trim "$suf")" "$extra" "$(trim "$gate")" "$(trim "$dtbos")"
          _i=$((_i + 1))
        done <"$PROFILES"
      done

  # Default session for every profile: the no-DE multi-user target, where the cog-seat1
  # kiosk runs (and @TV's kodi, enabled under multi-user). Only @Desktop overrides this to
  # graphical.target (for sddm); @Minimal/@Router/@TV all stay on multi-user.
  - action: run
    description: Set the default boot target to multi-user (only @Desktop overrides)
    chroot: true
    command: systemctl set-default multi-user.target

  # Stamp the build id into os-release (feeds hostname, MOTD, login banner). Done here, not with
  # debugfs post-image, because the rootfs is btrfs; every profile inherits it from @Minimal_stock.
  - action: run
    description: Stamp the build id into os-release
    chroot: true
    command: echo BUILD_ID={{ $buildid }} >> /etc/os-release

  - action: run
    description: Stamp @Minimal_stock's factory-origin marker
    chroot: false
    command: |
      set -eu
      . "$IMAGEMNTDIR/usr/lib/flipper-btrfs.sh"
      stamp_stock_origin "$IMAGEMNTDIR" @Minimal_{{ $buildid }}_stock

  # ===========================================================================
  # Stock (RO) bases + per-profile bootable roots.
  #
  # @Minimal_stock is the RO golden image of the common base. Each profile is a
  # WRITABLE snapshot of it (COW: shares the base, only profile packages add new extents),
  # mounted at $IMAGEMNTDIR so standard debos `apt`/`overlay` actions install into it;
  # it is then locked RO and the writable @<profile> bootable root is snapshotted from it.
  # BLS selects a profile via rootflags=subvol=@<profile>. The kernel lives in
  # @Minimal_stock (installed above), so every profile inherits it via COW. /boot,
  # @home and @var-* are separate top-level subvols shared by all profiles.
  #
  # KDE and TV-Media-Box install their packages (apt) + config (overlay); only @Desktop changes
  # its default target (to graphical, for sddm); TV/Router/Minimal stay on multi-user.
  # Router applies only its config overlay (NM AP/WAN + ip-forwarding); no packages needed.
  # ===========================================================================

  - action: run
    description: Lock @Minimal_stock RO and spawn writable @Minimal
    chroot: false
    command: |
      set -eu
      sync
      ROOTPART="$({{ $rootdev }})"                 # @Minimal_stock is still mounted at $IMAGEMNTDIR
      # Mount the btrfs top level at a fixed path and KEEP it mounted for the whole profile
      # sequence: it is our stable handle for `findmnt --target` (device lookup then works in
      # every debos mode, whether or not $IMAGEMNTDIR is mounted) and where the subvols live.
      TOP="${IMAGEMNTDIR%/}.toplevel"
      mkdir -p "$TOP"
      mount -t btrfs -o subvolid=5 "$ROOTPART" "$TOP"
      # release @Minimal_stock and its nested submounts so it can be locked RO and the profile
      # factories can mount here
      findmnt -rno TARGET --submounts "$IMAGEMNTDIR" \
        | awk '{ print length, $0 }' | sort -rn | cut -d" " -f2- \
        | while read -r mp; do umount "$mp"; done
      # @Minimal is a writable snapshot of the golden base, matching every other profile
      # (each a snapshot of its _stock). Its entry-token, baked before the kernel install,
      # is inherited via the snapshot.
      btrfs property set "$TOP/@Minimal_{{ $buildid }}_stock" ro true
      btrfs subvolume snapshot "$TOP/@Minimal_{{ $buildid }}_stock" "$TOP/@Minimal"

  # --- @Desktop ------------------------------------------------------------------
  - action: run
    description: Snapshot writable @Desktop_stock and mount it
    chroot: false
    command: |
      set -eu
      TOP="${IMAGEMNTDIR%/}.toplevel"
      ROOTPART="$(findmnt -fn --nofsroot -o SOURCE --target "$TOP")"
      btrfs subvolume snapshot "$TOP/@Minimal_{{ $buildid }}_stock" "$TOP/@Desktop_{{ $buildid }}_stock"
      mount -t btrfs -o "{{ $btrfsopts }},subvol=@Desktop_{{ $buildid }}_stock" "$ROOTPART" "$IMAGEMNTDIR"
      . "$IMAGEMNTDIR/usr/lib/flipper-btrfs.sh"
      stamp_stock_origin "$IMAGEMNTDIR" @Desktop_{{ $buildid }}_stock
  - action: apt
    description: KDE desktop packages
    recommends: false        # image is minbase/no-recommends; deps are listed explicitly
    packages:
      - bluedevil
      - blueman
      - breeze-gtk-theme
      - kde-config-gtk-style
      - kde-config-screenlocker
      - kde-spectacle
      - kde-standard
      - konsole
      - kscreen
      - mpv
      - plasma-nm
      - plasma-systemmonitor
      - powerdevil
      - sddm
      - sddm-theme-breeze
      - systemsettings
  - action: run
    description: Prune orphaned packages and apt cache
    chroot: true
    command: |
      set -eu
      apt-get autoremove --purge -y
      apt-get clean
      rm -rf /var/lib/apt/lists/*
  - action: overlay
    description: KDE profile config (sddm autologin, plasma, wallpaper)
    source: overlays/profile-kde
    destination: /
  - action: run
    description: Make the KDE desktop the default session on @Desktop
    chroot: true
    command: systemctl set-default graphical.target
  - action: run
    description: Pin @Desktop's kernel entry-token (NN from flipper-profiles)
    chroot: true
    command: |
      set -eu
      . /usr/lib/flipper-bls.sh
      make_token "$(profile_base_nn @Desktop)" @Desktop > /etc/kernel/entry-token
  - action: run
    description: Lock @Desktop_stock RO and spawn writable @Desktop
    chroot: false
    command: |
      set -eu
      TOP="${IMAGEMNTDIR%/}.toplevel"
      umount "$IMAGEMNTDIR"
      btrfs property set "$TOP/@Desktop_{{ $buildid }}_stock" ro true
      btrfs subvolume snapshot "$TOP/@Desktop_{{ $buildid }}_stock" "$TOP/@Desktop"

  # --- @TV-Media-Box ---------------------------------------------------------
  - action: run
    description: Snapshot writable @TV-Media-Box_stock and mount it
    chroot: false
    command: |
      set -eu
      TOP="${IMAGEMNTDIR%/}.toplevel"
      ROOTPART="$(findmnt -fn --nofsroot -o SOURCE --target "$TOP")"
      btrfs subvolume snapshot "$TOP/@Minimal_{{ $buildid }}_stock" "$TOP/@TV-Media-Box_{{ $buildid }}_stock"
      mount -t btrfs -o "{{ $btrfsopts }},subvol=@TV-Media-Box_{{ $buildid }}_stock" "$ROOTPART" "$IMAGEMNTDIR"
      . "$IMAGEMNTDIR/usr/lib/flipper-btrfs.sh"
      stamp_stock_origin "$IMAGEMNTDIR" @TV-Media-Box_{{ $buildid }}_stock
  - action: apt
    description: TV media box packages
    recommends: false
    packages:
      - cage
      - kodi
      - kodi-eventclients-kodi-send
  - action: run
    description: Prune orphaned packages and apt cache
    chroot: true
    command: |
      set -eu
      apt-get autoremove --purge -y
      apt-get clean
      rm -rf /var/lib/apt/lists/*
  - action: overlay
    description: TV media box profile config (kodi, enabled under multi-user)
    source: overlays/profile-tv-media-box
    destination: /
  - action: run
    description: Pin @TV-Media-Box's kernel entry-token (NN from flipper-profiles)
    chroot: true
    command: |
      set -eu
      . /usr/lib/flipper-bls.sh
      make_token "$(profile_base_nn @TV-Media-Box)" @TV-Media-Box > /etc/kernel/entry-token
  - action: run
    description: Lock @TV-Media-Box_stock RO and spawn writable @TV-Media-Box
    chroot: false
    command: |
      set -eu
      TOP="${IMAGEMNTDIR%/}.toplevel"
      umount "$IMAGEMNTDIR"
      btrfs property set "$TOP/@TV-Media-Box_{{ $buildid }}_stock" ro true
      btrfs subvolume snapshot "$TOP/@TV-Media-Box_{{ $buildid }}_stock" "$TOP/@TV-Media-Box"

  # --- @Router ---------------------------------------------------------------
  - action: run
    description: Snapshot writable @Router_stock and mount it
    chroot: false
    command: |
      set -eu
      TOP="${IMAGEMNTDIR%/}.toplevel"
      ROOTPART="$(findmnt -fn --nofsroot -o SOURCE --target "$TOP")"
      btrfs subvolume snapshot "$TOP/@Minimal_{{ $buildid }}_stock" "$TOP/@Router_{{ $buildid }}_stock"
      mount -t btrfs -o "{{ $btrfsopts }},subvol=@Router_{{ $buildid }}_stock" "$ROOTPART" "$IMAGEMNTDIR"
      . "$IMAGEMNTDIR/usr/lib/flipper-btrfs.sh"
      stamp_stock_origin "$IMAGEMNTDIR" @Router_{{ $buildid }}_stock
  # @Router needs no packages beyond Minimal (NetworkManager + dnsmasq-base + wpa_supplicant
  # are common); it just adds the AP/WAN connections + ip-forwarding via the overlay. Its
  # default session stays multi-user (inherited); NM autoconnect brings the router up.
  - action: overlay
    description: Router profile config (NM AP/WAN connections, ip-forwarding)
    source: overlays/profile-router
    destination: /
  - action: run
    description: Fix NetworkManager connection permissions on @Router
    chroot: true
    command: chmod 600 /etc/NetworkManager/system-connections/*.nmconnection
  - action: run
    description: Pin @Router's kernel entry-token (NN from flipper-profiles)
    chroot: true
    command: |
      set -eu
      . /usr/lib/flipper-bls.sh
      make_token "$(profile_base_nn @Router)" @Router > /etc/kernel/entry-token
  - action: run
    description: Lock @Router_stock RO and spawn writable @Router
    chroot: false
    command: |
      set -eu
      TOP="${IMAGEMNTDIR%/}.toplevel"
      umount "$IMAGEMNTDIR"
      btrfs property set "$TOP/@Router_{{ $buildid }}_stock" ro true
      btrfs subvolume snapshot "$TOP/@Router_{{ $buildid }}_stock" "$TOP/@Router"

  # --- @No-Graphics ----------------------------------------------------------
  # Headless @Minimal: same userspace, no extra packages. The graphics pipeline (VOP/HDMI/
  # DP/GPU) is powered off entirely by the rk3576-no-graphics DT overlay its BLS entry applies
  # (dtbos column), so it only needs its own root subvol + pinned entry-token.
  - action: run
    description: Snapshot writable @No-Graphics_stock and mount it
    chroot: false
    command: |
      set -eu
      TOP="${IMAGEMNTDIR%/}.toplevel"
      ROOTPART="$(findmnt -fn --nofsroot -o SOURCE --target "$TOP")"
      btrfs subvolume snapshot "$TOP/@Minimal_{{ $buildid }}_stock" "$TOP/@No-Graphics_{{ $buildid }}_stock"
      mount -t btrfs -o "{{ $btrfsopts }},subvol=@No-Graphics_{{ $buildid }}_stock" "$ROOTPART" "$IMAGEMNTDIR"
      . "$IMAGEMNTDIR/usr/lib/flipper-btrfs.sh"
      stamp_stock_origin "$IMAGEMNTDIR" @No-Graphics_{{ $buildid }}_stock
  - action: run
    description: Pin @No-Graphics's kernel entry-token (NN from flipper-profiles)
    chroot: true
    command: |
      set -eu
      . /usr/lib/flipper-bls.sh
      make_token "$(profile_base_nn @No-Graphics)" @No-Graphics > /etc/kernel/entry-token
  - action: run
    description: Lock @No-Graphics_stock RO and spawn writable @No-Graphics
    chroot: false
    command: |
      set -eu
      TOP="${IMAGEMNTDIR%/}.toplevel"
      umount "$IMAGEMNTDIR"
      btrfs property set "$TOP/@No-Graphics_{{ $buildid }}_stock" ro true
      btrfs subvolume snapshot "$TOP/@No-Graphics_{{ $buildid }}_stock" "$TOP/@No-Graphics"

  # Export each _stock as versioned send streams (receive-snapshot format): a FULL stream
  # (_pack.zst) for all, plus an INCREMENTAL vs @Minimal (_inc_pack.zst) for the rest.
  - action: run
    description: Export each _stock as versioned send streams (full for all, plus incrementals)
    chroot: false
    command: |
      set -eu
      TOP="${IMAGEMNTDIR%/}.toplevel"
      MIN="@Minimal_{{ $buildid }}_stock"
      for s in "$TOP"/@*_stock; do
        [ -d "$s" ] || continue
        name=$(basename "$s")
        btrfs send "$s" | zstd -T0 -o "$ARTIFACTDIR/${name#@}_pack.zst"
        if [ "$name" != "$MIN" ]; then
          btrfs send -p "$TOP/$MIN" "$s" | zstd -T0 -o "$ARTIFACTDIR/${name#@}_inc_pack.zst"
        fi
      done

  # Unmount the top level and remount @Minimal at the mountpoint debos owns, so its
  # image-partition Cleanup can unmount it and detach the loop. (The profile builds left
  # $IMAGEMNTDIR unmounted, and the lingering top-level mount would hold the loop busy.)
  - action: run
    description: Unmount the top level and remount @Minimal for debos cleanup
    chroot: false
    command: |
      set -eu
      TOP="${IMAGEMNTDIR%/}.toplevel"
      ROOTPART="$(findmnt -fn --nofsroot -o SOURCE --target "$TOP")"
      umount "$TOP"; rmdir "$TOP"
      mount -t btrfs -o "{{ $btrfsopts }},subvol=@Minimal" "$ROOTPART" "$IMAGEMNTDIR"
