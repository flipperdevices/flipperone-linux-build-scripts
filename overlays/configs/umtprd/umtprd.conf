# uMTP-Responder config. usb-gadget-setup.sh --mtp sets up the configfs gadget and mounts
# FunctionFS at /dev/ffs-mtp; umtprd writes the descriptors and serves the storage below.
# Keys follow the umtp-responder package default (FunctionFS mode).

# Keep running across host disconnects.
loop_on_disconnect 1

# storage "PATH" "NAME" "options"
storage "/home" "Home" "rw"

manufacturer "Flipper FZCO"
product "Flipper One Composite Device"
serial "0123456789AB"
firmware_version "Rev A"
interface "MTP"

usb_class 0x6
usb_subclass 0x1
usb_protocol 0x1

# FunctionFS mode; endpoint paths match the mount in usb-gadget-setup.sh (/dev/ffs-mtp).
usb_functionfs_mode 0x1
usb_dev_path   "/dev/ffs-mtp/ep0"
usb_epin_path  "/dev/ffs-mtp/ep1"
usb_epout_path "/dev/ffs-mtp/ep2"
usb_epint_path "/dev/ffs-mtp/ep3"
usb_max_packet_size 0x200
