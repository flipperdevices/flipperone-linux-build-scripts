# The home folder over SMB, for hosts that have no MTP client (macOS). No login: port 445 is
# open only on the USB gadget link, so whoever can reach it has the cable, see usb-only.nft.
# In router mode flipusb0 is a bridge port, so nothing is served there.
[global]
	server role = standalone server
	disable netbios = yes
	mdns name = mdns
	smb ports = 445
	map to guest = Bad User
	load printers = no
	printing = bsd
	printcap name = /dev/null
	disable spoolss = yes
	logging = systemd
	vfs objects = catia fruit streams_xattr
	fruit:metadata = stream
	fruit:model = Xserve

# The same folder and name as the MTP storage in /etc/umtprd/umtprd.conf, written as the
# same user, so a file copied in either way belongs to the session that opens it.
[Home]
	path = /home/user
	guest ok = yes
	guest only = yes
	read only = no
	force user = user
	map archive = no
