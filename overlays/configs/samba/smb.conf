# The home folder over SMB, for hosts that have no MTP client (macOS). No login: it listens
# only on the USB gadget link, so whoever can reach it has the cable. smbd runs only while
# flipusb0 exists, see smbd.service.d/usb-gadget.conf. In router mode flipusb0 is a bridge
# port with no address of its own, so nothing is served there.
[global]
	server role = standalone server
	interfaces = lo flipusb0
	bind interfaces only = yes
	disable netbios = yes
	mdns name = mdns
	smb ports = 445
	map to guest = Bad User
	load printers = no
	printing = bsd
	printcap name = /dev/null
	disable spoolss = yes
	logging = file
	log file = /var/log/samba/log.%m
	max log size = 1000
	vfs objects = catia fruit streams_xattr
	fruit:metadata = stream
	fruit:model = Xserve

# The same folder and name as the MTP storage in /etc/umtprd/umtprd.conf, written as the
# same user, so a file copied in either way belongs to the session that opens it.
[Home]
	path = /home/user
	guest ok = yes
	guest only = yes
	read only = no
	force user = user
	map archive = no
