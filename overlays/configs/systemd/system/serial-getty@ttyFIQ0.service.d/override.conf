[Service]
# vt220, which systemd defaults to here, reports no colour at all, so ncurses on
# this port is monochrome while ssh gets 256 from the client. An emulator is what
# attaches. Nothing drawing with crossterm reads terminfo or is affected.
Environment=TERM=xterm-256color
ExecStart=
ExecStart=-/sbin/agetty -a user --noreset --noclear --keep-baud 115200,57600,38400,9600 - ${TERM}
