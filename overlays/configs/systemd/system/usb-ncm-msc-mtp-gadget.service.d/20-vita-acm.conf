# The RG Vita Pro has no debug UART within reach, so its gadget carries a serial
# function as well, with a getty on it (92-vita-ttyGS0-getty.rules).
[Service]
ExecStart=
ExecStart=/bin/sh -c 'grep -qa anbernic,rg-vita-pro /proc/device-tree/compatible && acm=--acm; exec /usr/local/bin/usb-ncm-msc-mtp-gadget.sh $acm start'
