# Router mode only: end0 is the sole DHCP client; LAN-side ports must never grab a lease.
#
# In router mode the LAN ports (end1 and flipusb0) are bridge slaves / static / shared, brought
# up by the router-lan-*.service units -- none may act as a DHCP client.
# Without this, NetworkManager auto-creates a volatile DHCP "Wired connection" for any managed
# Ethernet lacking its own autoconnecting profile and raises it on carrier, so a LAN port could
# grab a lease and even pull a default route/DNS in from the LAN side.
#
# no-auto-default=* disables those auto-connections. Explicit profiles are untouched:
# end0 -> "Router WAN" (ipv4=auto) stays the only DHCP client; flipusb0 static / LAN bridge
# slaves still work.
#
# Router-ONLY on purpose: this file ships only in overlays/profile-router, so non-router
# profiles (desktop/tv/minimal) keep NetworkManager's auto-DHCP-anywhere convenience.
[main]
no-auto-default=*
