# sway on the RG Vita Pro screen, with flipctl as its only window (vita-flipctl.service).
#
# The 1080x1920 panel is mounted rotated, which sway doesn't apply on its own. Turned it is
# 1920x1080, which scale 7.5 makes flipctl's 256x144; nearest keeps the pixel fonts sharp.
output * transform 270 scale 7.5 scale_filter nearest

default_border none
seat * hide_cursor 100

# Plasma and Kodi handle the volume keys themselves; here nothing else would.
bindsym --locked XF86AudioRaiseVolume exec wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindsym --locked XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

# When flipctl exits, end the session and let the unit start it again.
exec sh -c 'cd /usr/share/flipctl && flipctl --wayland --remote 0.0.0.0:8899 --assets /usr/share/flipctl/assets/remote; swaymsg exit'
